name: clean specific workflow runs

on:
  schedule:
    - cron: "0 0 */2 * *"
  workflow_dispatch:

jobs:
  delete_runs:
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Delete old runs of specific workflow
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Gets all run IDs of the specific workflow, sorted by date, skipping the newest 2 and deleting the rest
          gh run list --workflow "Build EndeavourOS devel ISO (Hetzner Cloud)" --limit 100 --json databaseId --jq '.[2:] | .[].databaseId' | while read -r run_id; do
            if [ -n "$run_id" ]; then
              echo "Deleting run ID: $run_id"
              gh run delete "$run_id" > /dev/null || true
            fi
          done
