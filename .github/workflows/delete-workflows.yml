name: Clean old workflow runs

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  cleanup:
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Delete runs older than 1 day
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          THRESHOLD_DATE=$(date -u -d "1 day ago" +%Y-%m-%dT%H:%M:%SZ)
          echo "Searching for workflow runs created before: $THRESHOLD_DATE..."
          
          PAGE=1
          TOTAL_DELETED=0
          
          while true; do
            echo "Fetching page $PAGE..."
            RUNS_TO_DELETE=$(gh run list --limit 100 --page "$PAGE" --created "<$THRESHOLD_DATE" --json databaseId --jq '.[].databaseId')
            
            # If no runs are returned on this page, we are done
            if [ -z "$RUNS_TO_DELETE" ]; then
              echo "No more runs found on page $PAGE."
              break
            fi
            
            while read -r run_id; do
              if [ -n "$run_id" ]; then
                echo "Deleting run ID: $run_id"
                if gh run delete "$run_id"; then
                  TOTAL_DELETED=$((TOTAL_DELETED + 1))
                else
                  echo "Failed to delete run ID: $run_id"
                fi
              fi
            done <<< "$RUNS_TO_DELETE"
            
            PAGE=$((PAGE + 1))
          done
          
          echo "Successfully deleted a total of $TOTAL_DELETED old runs."
