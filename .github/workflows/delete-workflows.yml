name: Clean old workflow runs

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  cleanup:
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Delete runs older than 1 day
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Get repository name (e.g. owner/repo)
          REPO=$(gh repo view --json nameWithOwner -q .nameWithOwner)
          
          # ISO 8601 threshold for 1 day ago
          THRESHOLD_DATE=$(date -u -d "1 day ago" +%Y-%m-%dT%H:%M:%SZ)
          echo "Searching for workflow runs created before: $THRESHOLD_DATE in $REPO..."
          
          PAGE=1
          TOTAL_DELETED=0
          
          while true; do
            echo "Fetching page $PAGE via API..."
            
            # Query REST API directly with pagination and filter older runs
            RESPONSE=$(gh api "repos/$REPO/actions/runs?per_page=100&page=$PAGE" --jq '[.workflow_runs[] | select(.created_at < "'"$THRESHOLD_DATE"'") | .id]')
            
            COUNT=$(echo "$RESPONSE" | jq 'length')
            
            if [ "$COUNT" -eq 0 ]; then
              echo "No more old runs found on page $PAGE."
              break
            fi
            
            echo "Found $COUNT old run(s) on page $PAGE to delete."
            
            # Iterate and delete each run ID
            for run_id in $(echo "$RESPONSE" | jq -r '.[]'); do
              if [ -n "$run_id" ]; then
                echo "Deleting run ID: $run_id"
                if gh run delete "$run_id"; then
                  TOTAL_DELETED=$((TOTAL_DELETED + 1))
                else
                  echo "Failed to delete run ID: $run_id"
                fi
              fi
            done
            
            PAGE=$((PAGE + 1))
          done
          
          echo "Successfully deleted a total of $TOTAL_DELETED old runs."
