name: Clean old workflow runs

on:
  schedule:
    - cron: "0 0 */2 * *"
  workflow_dispatch:

jobs:
  cleanup:
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Delete runs older than 7 days
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Calculate timestamp for 7 days ago (604800 seconds)
          SEVEN_DAYS_AGO=$(( $(date +%s) - 604800 ))
          
          # Fetch all runs and delete those older than the threshold
          gh run list --limit 100 --json databaseId,createdAt --jq --argjson cutoff "$SEVEN_DAYS_AGO" \
            '.[] | select((.createdAt | fromdate) < $cutoff) | .databaseId' | while read -r run_id; do
            if [ -n "$run_id" ]; then
              echo "Deleting run ID: $run_id"
              gh run delete "$run_id" || true
            fi
          done
