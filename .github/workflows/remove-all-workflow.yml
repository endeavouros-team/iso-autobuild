name: Cleanup Workflow Runs

on:
  workflow_dispatch:

jobs:
  prune-old-actions:
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prune old workflow runs
        uses: yanovian/prune-old-actions@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          days-ago: 1
          dry-run: false
          keep-latest: 0
