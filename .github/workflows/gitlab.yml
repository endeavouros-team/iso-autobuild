name: Sync to GitLab

on:
  push:
    branches:
      - '*'
    tags:
      - '*'
  delete:

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Push to GitLab
        env:
          GITLAB_TOKEN: ${{ secrets.GITLAB_PAT }}
        run: |
          # Add GitLab remote using environment variable directly in shell
          git remote add gitlab "https://oauth2:${GITLAB_TOKEN}@gitlab.com/endeavouros-filemirror/iso-autobuild.git"
          
          # Mirror all branches and tags
          git push gitlab --all --force
          git push gitlab --tags --force
