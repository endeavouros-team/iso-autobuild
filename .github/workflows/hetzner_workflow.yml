name: Build EndeavourOS devel ISO (Hetzner Cloud)

on:
  repository_dispatch:
    types: [calamares-done]
  workflow_dispatch:

jobs:
  # JOB 1: Dynamic provisioning of the high-performance build server via Hetzner API
  start-runner:
    runs-on: ubuntu-latest
    outputs:
      runner-label: ${{ steps.start-vps.outputs.label }}
      server-id: ${{ steps.start-vps.outputs.server_id }}
    steps:
      - name: Spin up Hetzner VPS via API
        id: start-vps
        uses: cyclenerd/hcloud-github-runner@v1
        with:
          hcloud_token: ${{ secrets.HETZNER_API_TOKEN }}
          github_token: ${{ secrets.GH_PAT_HETZNER }}
          server_type: ccx33       # 8 Dedicated AMD EPYC Cores, 32 GB RAM, 240 GB NVMe SSD
          image: ubuntu-24.04
          mode: create
          pre_runner_script: |
            apt-get update
            apt-get install -y docker.io
            systemctl start docker
            systemctl enable docker

  # JOB 2: Execution of compilation and ISO build workflow on the Hetzner runner
  build:
    needs: start-runner
    runs-on: ${{ needs.start-runner.outputs.runner-label }}
    timeout-minutes: 120

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Set current date as environment variable
        run: echo "DATE=$(date +'%Y.%m.%d')" >> $GITHUB_ENV

      - name: Set current time as environment variable
        run: echo "TIME=$(date +'%H-%M')" >> $GITHUB_ENV

      # Running the Arch Linux build framework inside a privileged container directly via steps
      - name: Execute ISO Build within Privileged Arch Container
        run: |
          docker run --privileged --rm \
            -v ${{ github.workspace }}:/workspace \
            -w /workspace \
            -e DATE=${{ env.DATE }} \
            -e TIME=${{ env.TIME }} \
            archlinux:latest \
            bash -c "
              bash add-EndeavourOS && \
              bash prepare-action && \
              bash build-iso && \
              cp EndeavourOS-ISO/*.log EndeavourOS-ISO/out/ || true && \
              cd EndeavourOS-ISO/out && \
              tar -czvf EndeavourOS-${{ env.DATE }}-${{ env.TIME }}-devel-iso.tar.gz *.sha512sum *.iso *.log
            "

      # Fixed: Added secure quotes around the secret to prevent parsing errors on the host system
      - name: Upload server_DEVEL
        run: |
          curl -g -k -T EndeavourOS-ISO/out/*.tar.gz -u "${{ secrets.SERVER_STRING_DEVEL }}"

  # JOB 3: Mandatory infrastructure teardown to prevent unexpected billing charges
  stop-runner:
    needs: [start-runner, build]
    runs-on: ubuntu-latest
    if: always() # Ensures the instance is destroyed even if the build steps fail
    steps:
      - name: Destroy Hetzner VPS via API
        uses: cyclenerd/hcloud-github-runner@v1
        with:
          hcloud_token: ${{ secrets.HETZNER_API_TOKEN }}
          github_token: ${{ secrets.GH_PAT_HETZNER }}
          server_id: ${{ needs.start-runner.outputs.server-id }} # Fixed: Now correctly passing the server ID
          mode: delete
